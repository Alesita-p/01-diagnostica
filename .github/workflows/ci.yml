name: "Autograding"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  evaluate:
    name: "Autograding and Integrity Guard"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del Codigo (Pull Request)"
        if: github.event.pull_request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: "Checkout del Codigo (Default)"
        if: ${{ !github.event.pull_request }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Inyectar Tests Oficiales de 'main' (Cero Rebase)"
        run: |
          git fetch origin main
          git checkout origin/main -- tests/
          git checkout origin/main -- .github/scripts/
          git checkout origin/main -- package.json
          git checkout origin/main -- pnpm-lock.yaml

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Instalar Dependencias"
        run: pnpm install --no-frozen-lockfile

      # 1. FILE INTEGRITY GUARD
      - name: "File Integrity Guard"
        id: file_guard
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          UNAUTHORIZED_FILES=""
          for file in $CHANGED_FILES; do
            case "$file" in
              bloque_a/* | bloque_b/* | bloque_c/* | bloque_d/* | README.md) ;;
              *) UNAUTHORIZED_FILES="$UNAUTHORIZED_FILES $file" ;;
            esac
          done

          if [ -n "$UNAUTHORIZED_FILES" ]; then
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "unauthorized=$UNAUTHORIZED_FILES" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      # 2. COMMIT MESSAGE LINTER
      - name: "Commit Message Linter"
        id: commit_lint
        run: |
          COMMITS=$(git log --format="%s" origin/main...HEAD)
          INVALID_COMMITS=""
          PATTERN="^(feat|fix|docs|style|refactor|test|chore)(\([a-zA-Z0-9_\-]+\))?: .+"
          while IFS= read -r commit; do
            if [ -n "$commit" ] && ! [[ "$commit" =~ $PATTERN ]]; then
              INVALID_COMMITS="$INVALID_COMMITS '$commit'"
            fi
          done <<< "$COMMITS"

          if [ -n "$INVALID_COMMITS" ]; then
            echo "status=warn" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      # 3. TYPECHECK
      - name: "Strict Typecheck"
        id: typecheck
        continue-on-error: true
        run: |
          pnpm run check
          if [ $? -eq 0 ]; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      # 4. RUN INDIVIDUAL CHALLENGE TESTS
      - name: "Test Reto 01"
        id: test_01
        continue-on-error: true
        run: if pnpm run start:01; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: "Test Reto 02"
        id: test_02
        continue-on-error: true
        run: if pnpm run start:02; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: "Test Reto 03"
        id: test_03
        continue-on-error: true
        run: if pnpm run start:03; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: "Test Reto 04"
        id: test_04
        continue-on-error: true
        run: if pnpm run start:04; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      # 5. PUBLICAR REPORTE EN PR
      - name: "Publicar Comentario en el PR"
        uses: actions/github-script@v7
        if: ${{ always() && (github.event_name == 'pull_request_target' || github.event_name == 'pull_request') }}
        env:
          STATUS_FG: ${{ steps.file_guard.outputs.status }}
          STATUS_CL: ${{ steps.commit_lint.outputs.status }}
          STATUS_TC: ${{ steps.typecheck.outputs.status }}
          STATUS_T1: ${{ steps.test_01.outputs.status }}
          STATUS_T2: ${{ steps.test_02.outputs.status }}
          STATUS_T3: ${{ steps.test_03.outputs.status }}
          STATUS_T4: ${{ steps.test_04.outputs.status }}
        with:
          script: |
            const postComment = require('./.github/scripts/post-comment.js');
            await postComment({ github, context });
